[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seminspect"
version = "0.1.0"
description = "Reproducible offline benchmark for budget-aware multi-resolution SEM anomaly inspection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "Pillow==11.3.0",
  "PyYAML==6.0.2",
  "requests==2.32.5",
  "scipy==1.16.3",
  "scikit-image==0.25.2",
  "scikit-learn==1.9.1",
  "tqdm==4.67.1",
  "ImageHash==4.3.2",
  "opencv-python-headless==4.12.0.88",
  "pyarrow==21.0.0",
  "safetensors==0.6.2",
  "matplotlib==3.10.7",
  "seaborn==0.13.2",
  "timm==1.0.29",
]

[project.optional-dependencies]
torch = [
  "torch==2.13.0",
  "torchvision==0.28.0",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seminspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
