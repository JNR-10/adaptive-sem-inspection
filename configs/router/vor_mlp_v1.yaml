router:
  feature_schema: router_feature_schema_v1
  input_dim: 53
  hidden_dims: [64, 32]
  dropout: 0.20
  fn_weight: 10.0
  fp_weight: 1.0
  target_clip: [-5.0, 5.0]
  helpful_delta: 0.01
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 128
  max_epochs: 200
  patience: 20
  gradient_clip_norm: 1.0
  seeds: [0, 1, 2, 3, 4]
  huber_beta: 0.1
  auxiliary_weight: 0.25
  ridge_alphas: [0.01, 0.1, 1.0, 10.0]
