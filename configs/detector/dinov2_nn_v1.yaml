detector:
  encoder_type: dinov2
  backbone: dinov2_vits14_reg
  source_repository: facebookresearch/dinov2
  source_commit: 7764ea0f912e53c92e82eb78a2a1631e92725fc8
  frozen: true
  patch_pool: 2
  query_grid: [16, 16]
  normal_images: 8000
  descriptors_per_quality: 25000
  score_top_k: 5
  query_chunk: 1024
  memory_chunk: 4096
  search_dtype: float32
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
calibration:
  method: logistic_regression
  C: 1.0
  solver: lbfgs
  max_iter: 1000
  tol: 1.0e-8
  probability_clip: 1.0e-6
  ece_bins: 15
